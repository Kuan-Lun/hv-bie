[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hv_bie"
version = "0.7.1"
description = "HV Battle Intelligence Extractor: parse HentaiVerse battle HTML into structured Python dataclasses"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Kuan-Lun Wang", email = "polyphonicared@gmail.com" }]
dependencies = ["beautifulsoup4>=4.15.0,<5.0.0"]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/hv-bie"
Source = "https://github.com/Kuan-Lun/hv-bie"
Tracker = "https://github.com/Kuan-Lun/hv-bie/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.3,<1.0.0",
    "mypy>=2.3.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "black>=26.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["hv_bie"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
src = ["hv_bie"]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]
extend-ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hv_bie"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
